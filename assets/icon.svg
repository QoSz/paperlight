<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D352D"/>
      <stop offset="1" stop-color="#221E1A"/>
    </linearGradient>
    <radialGradient id="halo" cx="150" cy="140" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6B84A" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#F6B84A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#F6B84A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF4"/>
      <stop offset="1" stop-color="#F1E6D0"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="262" r="130" gradientTransform="translate(0 196.5) scale(1 0.25)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6B84A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F6B84A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#backdrop)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#halo)"/>

  <!-- page shadow -->
  <path transform="translate(0 12)" d="M152 96 H304 L376 168 V400 a16 16 0 0 1 -16 16 H152 a16 16 0 0 1 -16 -16 V112 a16 16 0 0 1 16 -16 Z"
        fill="#000" fill-opacity="0.3"/>

  <!-- page with folded corner -->
  <path d="M152 96 H304 L376 168 V400 a16 16 0 0 1 -16 16 H152 a16 16 0 0 1 -16 -16 V112 a16 16 0 0 1 16 -16 Z"
        fill="url(#paper)"/>
  <path d="M304 96 V152 a16 16 0 0 0 16 16 H376 Z" fill="#DCCDB0"/>

  <!-- light on the middle line -->
  <ellipse cx="256" cy="262" rx="130" ry="32" fill="url(#glow)"/>

  <!-- text lines -->
  <rect x="176" y="202" width="136" height="24" rx="12" fill="#B3A68F"/>
  <rect x="176" y="250" width="160" height="24" rx="12" fill="#F2AE33"/>
  <rect x="176" y="298" width="112" height="24" rx="12" fill="#B3A68F"/>
</svg>
